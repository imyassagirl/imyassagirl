site_name: I'm Yass a girl
site_description: Recopilación de mis hiperfijaciones para que no se me olvide nada.

theme:
  name: material
  logo: assets/logo.png
  language: es

  font:
    text: Inter
    code: JetBrains Mono
    heading: Fraunces

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom

  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy


extra_css:
  - https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

nav:
  - Inicio: index.md
  - Salud: salud/index.md
  - Belleza y cosmética: belleza-cosmetica/index.md
  - Leyes y finanzas: leyes-finanzas/index.md
  - Hogar y lifestyle: hogar-lifestyle/index.md
  - Web: web/index.md

plugins:
  - search:
      lang: es

hooks:
  - hooks/busqueda_tildes.py