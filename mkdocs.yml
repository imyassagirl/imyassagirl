site_name: I'm Yass, a girl
site_description: Cosas que te ayudan a sobrevivir a la vida adulta

theme:
  name: material

  font:
    text: Inter
    code: JetBrains Mono
    heading: Fraunces

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom

  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - search.highlight
    - content.code.copy

extra_css:
  - https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css
  - stylesheets/extra.css

nav:
  - Inicio: index.md
  - Salud: salud/index.md
  - Belleza y cosmética: belleza-cosmetica/index.md
  - Ropa y zapatos: ropa-zapatos/index.md
  - Leyes y finanzas: leyes-finanzas/index.md
  - Hogar y lifestyle: hogar-lifestyle/index.md